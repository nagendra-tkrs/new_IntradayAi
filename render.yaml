services:
  - type: web
    name: trading-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./intradayai.db
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: GOOGLE_CLIENT_ID
        value: 678365536626-2ago6n13j2a71e36jp0gi33gj2jfr30f.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://trading.tksrproductservices.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://trading.tksrproductservices.com
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://trading.tksrproductservices.com"]'
      - key: INITIAL_CAPITAL
        value: "1000000"
      - key: MAX_RISK_PER_TRADE_PCT
        value: "2.0"
      - key: MAX_DAILY_LOSS_PCT
        value: "5.0"
      - key: MAX_TRADES_PER_DAY
        value: "10"
      - key: MAX_SIMULTANEOUS_POSITIONS
        value: "5"
      - key: MARKET_DATA_PROVIDER
        value: yfinance
      - key: YF_DEFAULT_UNIVERSE
        value: NIFTY50
    healthCheckPath: /api/health
    autoDeploy: true
