version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./intradayai.db
      - MARKET_DATA_PROVIDER=mock
      - INITIAL_CAPITAL=1000000
      - MAX_RISK_PER_TRADE_PCT=2.0
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
